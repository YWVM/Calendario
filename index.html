<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuadrícula del cuatrimestre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2E7; --paper-dark:#EDE7D6; --grid-line:#DDD4B8;
  --ink:#2B3A45; --ink-soft:#5B6B74;
  --ochre:#B9812E; --ochre-soft:#F0DFB8;
  --teal:#3E6B62; --teal-soft:#D7E7E1;
  --done:#4C7A5A; --done-bg:#DCEADB;
  --line:#C9BE9E; --card:#FFFDF6;
  --shadow:0 1px 0 rgba(43,58,69,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E2320; --paper-dark:#242A26; --grid-line:#343B34;
    --ink:#EDE9DC; --ink-soft:#A9B3A9;
    --ochre:#D9A24B; --ochre-soft:#3A3222;
    --teal:#7FB3A5; --teal-soft:#243430;
    --done:#7FB88E; --done-bg:#25352A;
    --line:#3A4038; --card:#252B27;
    --shadow:0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#1E2320; --paper-dark:#242A26; --grid-line:#343B34;
  --ink:#EDE9DC; --ink-soft:#A9B3A9;
  --ochre:#D9A24B; --ochre-soft:#3A3222;
  --teal:#7FB3A5; --teal-soft:#243430;
  --done:#7FB88E; --done-bg:#25352A;
  --line:#3A4038; --card:#252B27;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:26px 26px;
  background-attachment:local;
}
.wrap{max-width:1000px; margin:0 auto; padding:28px 20px 60px;}
h1{
  font-family:'Fraunces',serif; font-weight:600; font-size:clamp(28px,5vw,40px);
  margin:4px 0 2px; letter-spacing:-.01em;
}
.sub{color:var(--ink-soft); font-size:14.5px; margin:0 0 22px; max-width:60ch;}
.tabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line);}
.tab{
  font-family:inherit; font-size:14.5px; font-weight:600; color:var(--ink-soft);
  background:none; border:none; padding:9px 4px; margin-right:18px; cursor:pointer;
  border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
}
.tab.active{color:var(--ink); border-bottom-color:var(--ochre);}
.tab:hover{color:var(--ink);}
.panel{display:none;} .panel.active{display:block;}

/* --- Setup card --- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:18px 20px; margin-bottom:22px; box-shadow:var(--shadow);
}
.card h2{font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:0 0 12px;}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px;}
.row:last-child{margin-bottom:0;}
input[type=text], input[type=number]{
  font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line);
  border-radius:6px; background:var(--paper-dark); color:var(--ink); min-width:0;
}
input[type=text]{flex:1 1 160px;}
input[type=number]{width:64px;}
.daypick{display:flex; gap:5px; flex-wrap:wrap;}
.daybtn{
  font-family:inherit; font-size:12.5px; font-weight:600; width:34px; height:30px;
  border-radius:6px; border:1px solid var(--line); background:var(--paper-dark);
  color:var(--ink-soft); cursor:pointer;
}
.daybtn.on{background:var(--teal); border-color:var(--teal); color:#fff;}
.btn{
  font-family:inherit; font-size:13.5px; font-weight:600; padding:8px 14px;
  border-radius:6px; border:1px solid var(--ochre); background:var(--ochre-soft);
  color:var(--ink); cursor:pointer; white-space:nowrap;
}
.btn:hover{filter:brightness(0.97);}
.btn.primary{background:var(--ochre); color:#fff; border-color:var(--ochre);}
.subjlist{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
.subjrow{
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px;
  background:var(--paper-dark);
}
.dot{width:11px; height:11px; border-radius:50%; flex-shrink:0;}
.subjrow .name{font-weight:600; font-size:14px; flex:1;}
.subjrow .days{font-size:12px; color:var(--ink-soft);}
.rm{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; line-height:1; padding:2px 4px;}
.rm:hover{color:#B4443C;}

/* --- Calendar grid --- */
.weeklabel{
  font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--ink-soft);
  padding:10px 2px 6px;
}
.weekcard{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  overflow:hidden; margin-bottom:14px; box-shadow:var(--shadow);
}
.daysgrid{display:grid; grid-template-columns:repeat(7,1fr);}
.daycol{border-left:1px solid var(--line); padding:9px 7px 11px; min-height:64px;}
.daycol:first-child{border-left:none;}
.dayhead{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
.chip{
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500;
  padding:4px 6px; border-radius:5px; margin-bottom:4px; cursor:pointer; user-select:none;
  border:1px solid transparent;
}
.chip .box{
  width:13px; height:13px; border-radius:3px; border:1.5px solid var(--ink-soft);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--paper);
}
.chip.done .box{background:var(--done); border-color:var(--done);}
.chip.done .box::after{content:"✕"; color:#fff; font-size:9px; font-weight:700;}
.chip.done{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-soft);}
.empty-hint{color:var(--ink-soft); font-size:13.5px; padding:30px 4px; text-align:center;}

/* --- Progress --- */
.progresswrap{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; box-shadow:var(--shadow);}
.overall{margin-bottom:20px;}
.overall .num{font-family:'Fraunces',serif; font-size:38px; font-weight:600;}
.bar{height:9px; border-radius:5px; background:var(--paper-dark); overflow:hidden; margin-top:8px;}
.bar > div{height:100%; background:var(--done); border-radius:5px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-weight:700; color:var(--ink-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:8px 8px; border-bottom:1px solid var(--line);}
td{padding:9px 8px; border-bottom:1px solid var(--grid-line);}
tr:last-child td{border-bottom:none;}
.pbar{width:110px; height:7px; border-radius:4px; background:var(--paper-dark); overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;}
.pbar > div{height:100%; background:var(--teal);}
@media (max-width:640px){
  .daysgrid{grid-template-columns:repeat(7,1fr);}
  .daycol{padding:6px 4px 8px; min-height:52px;}
  .chip{font-size:10.5px; padding:3px 4px;}
  .dayhead{font-size:9.5px;}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cuadrícula del cuatrimestre</h1>

  <div class="tabs">
    <button class="tab active" data-tab="setup">Materias</button>
    <button class="tab" data-tab="cal">Calendario</button>
    <button class="tab" data-tab="prog">Progreso</button>
  </div>

  <div class="panel active" id="panel-setup">
    <div class="card">
      <h2>Duración del cuatrimestre</h2>
      <div class="row">
        <label style="font-size:13.5px;">Semanas:</label>
        <input type="number" id="weeksInput" min="1" max="30" value="16">
        <button class="btn" id="applyWeeks">Aplicar</button>
      </div>
    </div>
    <div class="card">
      <h2>Agregar materia o asignación</h2>
      <div class="row">
        <input type="text" id="subjName" placeholder="Nombre (ej. Cálculo II)">
        <div class="daypick" id="daypick"></div>
        <button class="btn primary" id="addSubj">Agregar</button>
      </div>
      <div class="subjlist" id="subjList"></div>
    </div>
  </div>

  <div class="panel" id="panel-cal"></div>

  <div class="panel" id="panel-prog">
    <div class="progresswrap">
      <div class="overall">
        <div class="num" id="overallPct">0%</div>
        <div style="color:var(--ink-soft); font-size:13px;" id="overallCount">0 de 0 completadas</div>
        <div class="bar"><div id="overallBar" style="width:0%"></div></div>
      </div>
      <table>
        <thead><tr><th>Materia</th><th>Progreso</th><th>Completadas</th></tr></thead>
        <tbody id="progBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const DAYS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const PALETTE = ["#B9812E","#3E6B62","#7A5C99","#B4443C","#3E6B99","#8A9B4C","#C97A9A","#5B7A99"];
const STORE_KEY = "cuatrimestre-tracker-v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { weeks:16, subjects:[], checked:{} };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let pickDays = [];

// tabs
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("panel-"+t.dataset.tab).classList.add("active");
    if(t.dataset.tab==="cal") renderCalendar();
    if(t.dataset.tab==="prog") renderProgress();
  });
});

// day picker for new subject
const daypickEl = document.getElementById("daypick");
DAYS.forEach((d,i)=>{
  const b = document.createElement("button");
  b.type="button"; b.className="daybtn"; b.textContent=d[0];
  b.title=d;
  b.addEventListener("click", ()=>{
    b.classList.toggle("on");
    const idx = pickDays.indexOf(i);
    if(idx>-1) pickDays.splice(idx,1); else pickDays.push(i);
  });
  daypickEl.appendChild(b);
});

document.getElementById("addSubj").addEventListener("click", ()=>{
  const name = document.getElementById("subjName").value.trim();
  if(!name){ return; }
  if(pickDays.length===0){ alert("Elige al menos un día de la semana."); return; }
  const color = PALETTE[state.subjects.length % PALETTE.length];
  state.subjects.push({ id: Date.now().toString(36), name, color, days:[...pickDays].sort() });
  document.getElementById("subjName").value = "";
  pickDays = [];
  daypickEl.querySelectorAll(".daybtn").forEach(b=>b.classList.remove("on"));
  saveState();
  renderSubjList();
});

document.getElementById("applyWeeks").addEventListener("click", ()=>{
  const v = parseInt(document.getElementById("weeksInput").value,10);
  if(v>0 && v<=30){ state.weeks = v; saveState(); }
});

function renderSubjList(){
  const el = document.getElementById("subjList");
  el.innerHTML = "";
  if(state.subjects.length===0){
    el.innerHTML = '<p style="color:var(--ink-soft); font-size:13.5px; margin:4px 0 0;">Aún no agregas materias.</p>';
    return;
  }
  state.subjects.forEach(s=>{
    const row = document.createElement("div");
    row.className = "subjrow";
    row.innerHTML = `<span class="dot" style="background:${s.color}"></span>
      <span class="name">${escapeHtml(s.name)}</span>
      <span class="days">${s.days.map(d=>DAYS[d]).join(" · ")}</span>
      <button class="rm" data-id="${s.id}" title="Eliminar">✕</button>`;
    row.querySelector(".rm").addEventListener("click", ()=>{
      state.subjects = state.subjects.filter(x=>x.id!==s.id);
      saveState(); renderSubjList();
    });
    el.appendChild(row);
  });
}

function escapeHtml(str){
  const d = document.createElement("div"); d.textContent = str; return d.innerHTML;
}

function renderCalendar(){
  document.getElementById("weeksInput").value = state.weeks;
  const el = document.getElementById("panel-cal");
  el.innerHTML = "";
  if(state.subjects.length===0){
    el.innerHTML = '<div class="empty-hint">Agrega materias en la pestaña "Materias" para generar la cuadrícula.</div>';
    return;
  }
  for(let w=0; w<state.weeks; w++){
    const wc = document.createElement("div");
    const label = document.createElement("div");
    label.className = "weeklabel";
    label.textContent = "Semana " + (w+1);
    el.appendChild(label);
    wc.className = "weekcard";
    const grid = document.createElement("div");
    grid.className = "daysgrid";
    DAYS.forEach((d,dayIdx)=>{
      const col = document.createElement("div");
      col.className = "daycol";
      const head = document.createElement("div");
      head.className = "dayhead"; head.textContent = d;
      col.appendChild(head);
      state.subjects.filter(s=>s.days.includes(dayIdx)).forEach(s=>{
        const key = `${w}-${dayIdx}-${s.id}`;
        const chip = document.createElement("div");
        const isDone = !!state.checked[key];
        chip.className = "chip" + (isDone ? " done" : "");
        chip.style.background = isDone ? "" : hexToSoft(s.color);
        chip.innerHTML = `<span class="box"></span><span>${escapeHtml(s.name)}</span>`;
        chip.addEventListener("click", ()=>{
          state.checked[key] = !state.checked[key];
          saveState();
          renderCalendar();
        });
        col.appendChild(chip);
      });
      grid.appendChild(col);
    });
    wc.appendChild(grid);
    el.appendChild(wc);
  }
}

function hexToSoft(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.13)`;
}

function renderProgress(){
  let totalAll=0, doneAll=0;
  const body = document.getElementById("progBody");
  body.innerHTML = "";
  state.subjects.forEach(s=>{
    const total = s.days.length * state.weeks;
    let done = 0;
    for(let w=0; w<state.weeks; w++){
      s.days.forEach(dayIdx=>{
        if(state.checked[`${w}-${dayIdx}-${s.id}`]) done++;
      });
    }
    totalAll += total; doneAll += done;
    const pct = total ? Math.round(done/total*100) : 0;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><span class="dot" style="background:${s.color}; display:inline-block; margin-right:7px;"></span>${escapeHtml(s.name)}</td>
      <td><span class="pbar"><div style="width:${pct}%; background:${s.color}"></div></span>${pct}%</td>
      <td>${done} / ${total}</td>`;
    body.appendChild(tr);
  });
  const overallPct = totalAll ? Math.round(doneAll/totalAll*100) : 0;
  document.getElementById("overallPct").textContent = overallPct + "%";
  document.getElementById("overallCount").textContent = `${doneAll} de ${totalAll} completadas`;
  document.getElementById("overallBar").style.width = overallPct + "%";
}

renderSubjList();
renderCalendar();
</script>
</body>
</html>
